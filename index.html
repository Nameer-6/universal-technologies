        rel="stylesheet"
      />

    <title>Universal Technologies — AI Agents, Automation & Software Delivery</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme')
          var preferLight =
            theme === 'light' ||
            (!theme && window.matchMedia('(prefers-color-scheme: light)').matches)
          if (!preferLight) document.documentElement.setAttribute('data-theme', 'dark')
        } catch (e) {}
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
