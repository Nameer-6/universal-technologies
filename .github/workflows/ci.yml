name: Build and SEO regression checks

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Fails on legacy URLs in sitemap/links, empty related sections, missing canonicals,
      # duplicate metadata, broken internal links and redirect regressions.
      - run: npm run check:seo
